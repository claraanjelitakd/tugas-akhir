<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1100" width="980" height="1100" style="background-color: #faf9f5; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrow Marker Sundaramoorthy Style -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6b1d2f"/>
    </marker>
    <filter id="soft-shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#3a1014" flood-opacity="0.10"/>
    </filter>
    <filter id="lane-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .doc-title { font-size: 19px; font-weight: 800; fill: #3e1218; letter-spacing: 0.3px; }
    .doc-sub { font-size: 12px; fill: #6b353b; }
    .lane-hdr { font-size: 15px; font-weight: 700; fill: #3a1014; text-anchor: middle; }
    .action-text { font-size: 12px; font-weight: 600; fill: #260c10; text-anchor: middle; }
    .action-sub { font-size: 10.5px; font-weight: 500; fill: #522227; text-anchor: middle; }
    .guard-text { font-size: 11px; font-weight: 600; fill: #6b1d2f; font-style: italic; }
    .flow-line { stroke: #6b1d2f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-linejoin: round; stroke-linecap: round; }
    .flow-line-dashed { stroke: #6b1d2f; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Document Header Banner -->
  <rect x="25" y="15" width="930" height="70" rx="6" ry="6" fill="#fcf4e8" stroke="#d4a373" stroke-width="1.2" />
  <text x="45" y="44" class="doc-title">UML ACTIVITY DIAGRAM: EDIT PROFIL &amp; GANTI PASSWORD</text>
  <text x="45" y="66" class="doc-sub">Format 2-Swimlane Mengacu Teori Sundaramoorthy (2022) - Akun Alumni UKDW</text>

  <!-- Outer Frame -->
  <rect x="25" y="100" width="930" height="980" rx="4" ry="4" fill="#ffffff" stroke="#6b1d2f" stroke-width="2.5" filter="url(#lane-shadow)" />

  <!-- Lane 1 Header -->
  <rect x="25" y="100" width="465" height="45" fill="#fdf0dd" stroke="#6b1d2f" stroke-width="2" />
  <text x="257" y="128" class="lane-hdr">Alumni UKDW</text>

  <!-- Lane 2 Header -->
  <rect x="490" y="100" width="465" height="45" fill="#fdf0dd" stroke="#6b1d2f" stroke-width="2" />
  <text x="722" y="128" class="lane-hdr">System (Sistem Tracer Study UKDW)</text>

  <!-- Lane Vertical Divider -->
  <line x1="490" y1="100" x2="490" y2="1080" stroke="#6b1d2f" stroke-width="2" />

  <!-- Content Elements -->

    <!-- Initial Node -->
    <circle cx="257" cy="175" r="13" fill="#6b1d2f" stroke="#3a1014" stroke-width="1.5" />

<line x1="257" y1="188" x2="257" y2="225" class="flow-line" />

    <!-- Decision Node -->
    <polygon points="257,227 280,245 257,263 234,245" fill="#fefee8" stroke="#6b1d2f" stroke-width="2" filter="url(#soft-shadow)" />

<line x1="257" y1="263" x2="257" y2="295" class="flow-line" />

    <!-- Sync Bar (Fork/Join) -->
    <rect x="152" y="297" width="210" height="7" rx="2" ry="2" fill="#6b1d2f" />

<line x1="167" y1="304" x2="167" y2="340" class="flow-line" />

    <!-- Action State -->
    <rect x="90" y="343" width="155" height="45" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="167" y="358" class="action-text">Change Password</text>
<text x="167" y="375" class="action-sub">Pilih Menu Ganti Password</text>

<line x1="167" y1="388" x2="167" y2="430" class="flow-line" />

    <!-- Action State -->
    <rect x="90" y="433" width="155" height="45" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="167" y="448" class="action-text">Enter Old Password</text>
<text x="167" y="465" class="action-sub">Masukkan Password Lama</text>

<line x1="167" y1="478" x2="167" y2="520" class="flow-line" />

    <!-- Action State -->
    <rect x="87" y="521" width="160" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="167" y="538" class="action-text">Enter New Password</text>
<text x="167" y="555" class="action-sub">&amp; Konfirmasi Password Baru</text>

<line x1="347" y1="304" x2="347" y2="360" class="flow-line" />

    <!-- Action State -->
    <rect x="270" y="361" width="155" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="347" y="378" class="action-text">Edit Profile Details</text>
<text x="347" y="395" class="action-sub">Buka Form Data Biodata</text>

<line x1="347" y1="409" x2="347" y2="475" class="flow-line" />

    <!-- Action State -->
    <rect x="267" y="476" width="160" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="347" y="493" class="action-text">Enter New Details</text>
<text x="347" y="510" class="action-sub">Input Karir &amp; Kontak Baru</text>


    <!-- Sync Bar (Fork/Join) -->
    <rect x="637" y="637" width="170" height="7" rx="2" ry="2" fill="#6b1d2f" />

<polyline points="167,569 167,605 682,605 682,636" class="flow-line" />
<polyline points="347,524 347,605 762,605 762,636" class="flow-line" />
<line x1="722" y1="644" x2="722" y2="730" class="flow-line" />
<text x="732" y="685" class="guard-text" text-anchor="left">[ check validity of details ]</text>

    <!-- Decision Node -->
    <polygon points="722,732 745,750 722,768 699,750" fill="#fefee8" stroke="#6b1d2f" stroke-width="2" filter="url(#soft-shadow)" />

<line x1="745" y1="750" x2="862" y2="750" class="flow-line" />
<text x="792" y="742" class="guard-text" text-anchor="center">[invalid]</text>

    <!-- Flow Final Node (Crossed Circle) -->
    <circle cx="877" cy="750" r="13" fill="#ffffff" stroke="#6b1d2f" stroke-width="2" />
    <line x1="870" y1="743" x2="884" y2="757" stroke="#6b1d2f" stroke-width="2" stroke-linecap="round"/>
    <line x1="884" y1="743" x2="870" y2="757" stroke="#6b1d2f" stroke-width="2" stroke-linecap="round"/>

<line x1="722" y1="768" x2="722" y2="830" class="flow-line" />
<text x="732" y="798" class="guard-text" text-anchor="left">[valid]</text>

    <!-- Action State -->
    <rect x="622" y="831" width="200" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="722" y="848" class="action-text">Update Database</text>
<text x="722" y="865" class="action-sub">Commit Perubahan ke Tabel Terkait</text>

<line x1="722" y1="879" x2="722" y2="935" class="flow-line" />

    <!-- Action State -->
    <rect x="612" y="936" width="220" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="722" y="953" class="action-text">Tampilkan Konfirmasi Sukses</text>
<text x="722" y="970" class="action-sub">Pesan Feedback Berhasil Disimpan</text>

<line x1="722" y1="984" x2="722" y2="1025" class="flow-line" />

    <!-- Final Node (Bullseye) -->
    <circle cx="722" cy="1040" r="14" fill="#ffffff" stroke="#6b1d2f" stroke-width="2" />
    <circle cx="722" cy="1040" r="8.5" fill="#6b1d2f" />


</svg>
