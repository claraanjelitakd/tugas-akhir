<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1480" width="1060" height="1480" style="background-color: #faf9f5; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrow Marker Sundaramoorthy Style -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6b1d2f"/>
    </marker>
    <filter id="soft-shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#3a1014" flood-opacity="0.10"/>
    </filter>
    <filter id="lane-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .doc-title { font-size: 19px; font-weight: 800; fill: #3e1218; letter-spacing: 0.3px; }
    .doc-sub { font-size: 12px; fill: #6b353b; }
    .lane-hdr { font-size: 15px; font-weight: 700; fill: #3a1014; text-anchor: middle; }
    .action-text { font-size: 12px; font-weight: 600; fill: #260c10; text-anchor: middle; }
    .action-sub { font-size: 10.5px; font-weight: 500; fill: #522227; text-anchor: middle; }
    .guard-text { font-size: 11px; font-weight: 600; fill: #6b1d2f; font-style: italic; }
    .flow-line { stroke: #6b1d2f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-linejoin: round; stroke-linecap: round; }
    .flow-line-dashed { stroke: #6b1d2f; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Document Header Banner -->
  <rect x="25" y="15" width="1010" height="70" rx="6" ry="6" fill="#fcf4e8" stroke="#d4a373" stroke-width="1.2" />
  <text x="45" y="44" class="doc-title">UML ACTIVITY DIAGRAM: REKOMENDASI KECOCOKAN PERUSAHAAN</text>
  <text x="45" y="66" class="doc-sub">Format 2-Swimlane Mengacu Teori Sundaramoorthy (2022) - Multi-Level Similarity &amp; Auto-Replace</text>

  <!-- Outer Frame -->
  <rect x="25" y="100" width="1010" height="1360" rx="4" ry="4" fill="#ffffff" stroke="#6b1d2f" stroke-width="2.5" filter="url(#lane-shadow)" />

  <!-- Lane 1 Header -->
  <rect x="25" y="100" width="505" height="45" fill="#fdf0dd" stroke="#6b1d2f" stroke-width="2" />
  <text x="277" y="128" class="lane-hdr">Administrator Verifikator (Super Admin / Fakultas / Prodi)</text>

  <!-- Lane 2 Header -->
  <rect x="530" y="100" width="505" height="45" fill="#fdf0dd" stroke="#6b1d2f" stroke-width="2" />
  <text x="782" y="128" class="lane-hdr">System (PerusahaanVerificationService &amp; Database)</text>

  <!-- Lane Vertical Divider -->
  <line x1="530" y1="100" x2="530" y2="1460" stroke="#6b1d2f" stroke-width="2" />

  <!-- Content Elements -->

    <!-- Initial Node -->
    <circle cx="277" cy="170" r="13" fill="#6b1d2f" stroke="#3a1014" stroke-width="1.5" />

<line x1="277" y1="183" x2="277" y2="215" class="flow-line" />

    <!-- Action State -->
    <rect x="162" y="216" width="230" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
