<text x="857" y="545" class="action-sub">Ekstraksi Token &amp; Singkatan</text>


    <!-- Sync Bar (Fork/Join) -->
    <rect x="687" y="592" width="190" height="7" rx="2" ry="2" fill="#6b1d2f" />

<line x1="707" y1="559" x2="707" y2="591" class="flow-line" />
<line x1="857" y1="559" x2="857" y2="591" class="flow-line" />
<line x1="782" y1="599" x2="782" y2="635" class="flow-line" />

    <!-- Action State -->
