    <rect x="635" y="511" width="145" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="707" y="528" class="action-text">Clean Company Name</text>
<text x="707" y="545" class="action-sub">Hapus PT/CV &amp; Stopwords</text>

