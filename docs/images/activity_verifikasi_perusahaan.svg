<text x="292" y="1045" class="guard-text" text-anchor="left">[Data Baru Valid]</text>

    <!-- Action State -->
    <rect x="270" y="1106" width="150" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
