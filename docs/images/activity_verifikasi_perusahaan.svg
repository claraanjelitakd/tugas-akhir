<text x="782" y="1140" class="action-sub">Kunci Baris Data Terkait</text>

<line x1="782" y1="1154" x2="782" y2="1195" class="flow-line" />

    <!-- Action State -->
    <rect x="662" y="1196" width="240" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
