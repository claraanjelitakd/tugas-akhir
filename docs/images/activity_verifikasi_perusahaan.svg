<text x="782" y="420" class="action-sub">Muat Daftar Perusahaan Terverifikasi</text>

<line x1="782" y1="434" x2="782" y2="470" class="flow-line" />

    <!-- Sync Bar (Fork/Join) -->
    <rect x="687" y="472" width="190" height="7" rx="2" ry="2" fill="#6b1d2f" />

<line x1="707" y1="479" x2="707" y2="510" class="flow-line" />

