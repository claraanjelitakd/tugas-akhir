<text x="277" y="340" class="action-sub">Memicu Komputasi Algoritma Similarity</text>

<polyline points="392,330 782,330 782,385" class="flow-line" />

    <!-- Action State -->
    <rect x="662" y="386" width="240" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
