  <path d="M157 224L370 190M157 224L680 190M157 224L965 190" class="assoc"/>
  <path d="M157 544L680 190M157 544L345 390M157 544L670 390M157 544L975 390M157 544L1305 390M157 544L545 535M157 544L940 1350" class="assoc"/>
  <path d="M157 794L965 590" class="assoc"/>
