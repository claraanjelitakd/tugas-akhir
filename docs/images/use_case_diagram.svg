  <!-- Formal optional behaviour -->
  <path d="M1110 156L920 156" class="extend"/><text x="980" y="145" class="relation">&lt;&lt;extend&gt;&gt;</text>
  <path d="M805 354L620 354" class="extend"/><text x="655" y="343" class="relation">&lt;&lt;extend&gt;&gt;</text>
  <rect x="345" y="565" width="305" height="54" rx="4" class="note"/><text x="360" y="586" class="noteText">UC09 menghasilkan token dan email.</text><text x="360" y="604" class="noteText">UC10 dilakukan kemudian oleh atasan.</text>
  <rect x="1460" y="780" width="315" height="55" rx="4" class="note"/><text x="1475" y="802" class="noteText">Data atasan adalah snapshot per alumni,</text><text x="1475" y="820" class="noteText">bukan master atasan bersama.</text>
