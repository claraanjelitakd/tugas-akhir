<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Use Case Diagram Sistem Tracer Study UKDW</title>
  <desc id="desc">Use case diagram dengan aktor publik, alumni, pengguna lulusan, admin prodi, admin fakultas, admin Biro III, superadmin, dan provider LinkedIn.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="2" stdDeviation="1.4" flood-opacity=".12"/></filter>
    <style>
      .bg { fill:#fff; } .boundary { fill:#f8fafc; stroke:#334155; stroke-width:2; }
      .uc { fill:#fff; stroke:#334155; stroke-width:1.5; filter:url(#shadow); }
      .assoc { fill:none; stroke:#64748b; stroke-width:1.25; } .extend { fill:none; stroke:#475569; stroke-width:1.2; stroke-dasharray:6 4; marker-end:url(#arrow); }
      .title { font:700 27px Arial, sans-serif; fill:#0f172a; } .sub { font:14px Arial, sans-serif; fill:#475569; }
      .system { font:700 18px Arial, sans-serif; fill:#0f172a; } .actor { font:700 14px Arial, sans-serif; text-anchor:middle; fill:#0f172a; } .actorSub { font:12px Arial, sans-serif; text-anchor:middle; fill:#475569; }
      .id { font:700 11px Arial, sans-serif; text-anchor:middle; fill:#0d542b; } .label { font:13px Arial, sans-serif; text-anchor:middle; fill:#0f172a; } .relation { font:italic 12px Arial, sans-serif; fill:#475569; }
      .note { fill:#fefce8; stroke:#a16207; stroke-width:1.1; } .noteText { font:12px Arial, sans-serif; fill:#422006; }
    </style>
  </defs>
  <rect class="bg" width="2200" height="1500"/>
  <text x="70" y="46" class="title">Use Case Diagram Sistem Tracer Study UKDW (SERU)</text>
  <text x="70" y="70" class="sub">Revisi aktor, hak akses, undangan evaluasi, dan data atasan per alumni</text>
  <rect x="295" y="100" width="1570" height="1325" rx="10" class="boundary"/>
  <text x="1818" y="130" text-anchor="end" class="system">Sistem Tracer Study UKDW (SERU)</text>

  <!-- Actors -->
  <g transform="translate(130 190)"><circle r="17" cx="0" cy="0" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 17V62M-27 34H27M0 62L-22 94M0 62L22 94" fill="none" stroke="#0f172a" stroke-width="2"/><text x="0" y="118" class="actor">Publik / Tamu</text></g>
  <g transform="translate(130 510)"><circle r="17" cx="0" cy="0" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 17V62M-27 34H27M0 62L-22 94M0 62L22 94" fill="none" stroke="#0f172a" stroke-width="2"/><text x="0" y="118" class="actor">Alumni</text></g>
  <g transform="translate(130 760)"><circle r="17" cx="0" cy="0" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 17V62M-27 34H27M0 62L-22 94M0 62L22 94" fill="none" stroke="#0f172a" stroke-width="2"/><text x="0" y="118" class="actor">Pengguna Lulusan</text><text x="0" y="136" class="actorSub">/ Atasan (token publik)</text></g>
  <g transform="translate(2010 265)"><circle r="17" cx="0" cy="0" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 17V62M-27 34H27M0 62L-22 94M0 62L22 94" fill="none" stroke="#0f172a" stroke-width="2"/><text x="0" y="118" class="actor">Admin Prodi</text></g>
  <g transform="translate(2010 515)"><circle r="17" cx="0" cy="0" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 17V62M-27 34H27M0 62L-22 94M0 62L22 94" fill="none" stroke="#0f172a" stroke-width="2"/><text x="0" y="118" class="actor">Admin Fakultas</text></g>
  <g transform="translate(2010 760)"><circle r="17" cx="0" cy="0" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 17V62M-27 34H27M0 62L-22 94M0 62L22 94" fill="none" stroke="#0f172a" stroke-width="2"/><text x="0" y="118" class="actor">Admin Biro III</text></g>
  <g transform="translate(2010 1035)"><circle r="17" cx="0" cy="0" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 17V62M-27 34H27M0 62L-22 94M0 62L22 94" fill="none" stroke="#0f172a" stroke-width="2"/><text x="0" y="118" class="actor">Superadmin</text></g>
  <g transform="translate(2010 1280)"><circle r="17" cx="0" cy="0" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 17V62M-27 34H27M0 62L-22 94M0 62L22 94" fill="none" stroke="#0f172a" stroke-width="2"/><text x="0" y="118" class="actor">Provider LinkedIn</text><text x="0" y="136" class="actorSub">/ Apify (sistem eksternal)</text></g>

  <!-- Use cases: authentication -->
  <g><ellipse cx="500" cy="190" rx="130" ry="34" class="uc"/><text x="500" y="184" class="id">UC01</text><text x="500" y="203" class="label">Mengakses beranda</text></g>
  <g><ellipse cx="800" cy="190" rx="120" ry="34" class="uc"/><text x="800" y="184" class="id">UC02</text><text x="800" y="203" class="label">Login</text></g>
  <g><ellipse cx="1110" cy="190" rx="145" ry="34" class="uc"/><text x="1110" y="184" class="id">UC03</text><text x="1110" y="203" class="label">Lupa dan reset kata sandi</text></g>
  <g><ellipse cx="1430" cy="190" rx="145" ry="34" class="uc"/><text x="1430" y="184" class="id">UC04</text><text x="1430" y="203" class="label">Ubah kata sandi wajib</text></g>

  <!-- Use cases: alumni and public evaluation -->
  <g><ellipse cx="490" cy="390" rx="145" ry="36" class="uc"/><text x="490" y="382" class="id">UC05</text><text x="490" y="402" class="label">Kelola profil dan karier</text></g>
  <g><ellipse cx="805" cy="390" rx="135" ry="36" class="uc"/><text x="805" y="382" class="id">UC06</text><text x="805" y="402" class="label">Usulkan perusahaan baru</text></g>
  <g><ellipse cx="1115" cy="390" rx="140" ry="36" class="uc"/><text x="1115" y="382" class="id">UC07</text><text x="1115" y="402" class="label">Isi kuesioner universitas</text></g>
  <g><ellipse cx="1430" cy="390" rx="125" ry="36" class="uc"/><text x="1430" y="382" class="id">UC08</text><text x="1430" y="402" class="label">Isi kuesioner prodi</text></g>
  <g><ellipse cx="700" cy="535" rx="155" ry="36" class="uc"/><text x="700" y="527" class="id">UC09</text><text x="700" y="547" class="label">Kirim undangan evaluasi</text></g>
  <g><ellipse cx="1140" cy="590" rx="175" ry="38" class="uc"/><text x="1140" y="582" class="id">UC10</text><text x="1140" y="602" class="label">Isi evaluasi pengguna lulusan</text></g>

  <!-- Use cases: common administration -->
  <g><ellipse cx="490" cy="740" rx="135" ry="36" class="uc"/><text x="490" y="732" class="id">UC11</text><text x="490" y="752" class="label">Dashboard dan monitoring</text></g>
  <g><ellipse cx="805" cy="740" rx="130" ry="36" class="uc"/><text x="805" y="732" class="id">UC12</text><text x="805" y="752" class="label">Direktori alumni</text></g>
  <g><ellipse cx="1115" cy="740" rx="115" ry="36" class="uc"/><text x="1115" y="732" class="id">UC23</text><text x="1115" y="752" class="label">Ekspor data</text></g>
  <g><ellipse cx="1430" cy="740" rx="135" ry="36" class="uc"/><text x="1430" y="732" class="id">UC24</text><text x="1430" y="752" class="label">Kelola data alumni</text></g>

  <!-- Use cases: configuration -->
  <g><ellipse cx="480" cy="920" rx="150" ry="36" class="uc"/><text x="480" y="912" class="id">UC13</text><text x="480" y="932" class="label">Kelola kuesioner universitas</text></g>
  <g><ellipse cx="805" cy="920" rx="140" ry="36" class="uc"/><text x="805" y="912" class="id">UC14</text><text x="805" y="932" class="label">Kelola kuesioner prodi</text></g>
  <g><ellipse cx="1130" cy="920" rx="145" ry="36" class="uc"/><text x="1130" y="912" class="id">UC15</text><text x="1130" y="932" class="label">Kelola instrumen evaluasi</text></g>
  <g><ellipse cx="1450" cy="920" rx="135" ry="36" class="uc"/><text x="1450" y="912" class="id">UC16</text><text x="1450" y="932" class="label">Verifikasi perusahaan</text></g>
  <g><ellipse cx="640" cy="1080" rx="125" ry="36" class="uc"/><text x="640" y="1072" class="id">UC17</text><text x="640" y="1092" class="label">Manajemen akun</text></g>
  <g><ellipse cx="1010" cy="1080" rx="175" ry="36" class="uc"/><text x="1010" y="1072" class="id">UC18</text><text x="1010" y="1092" class="label">Sinkronisasi dan review LinkedIn</text></g>
  <g><ellipse cx="1430" cy="1080" rx="185" ry="36" class="uc"/><text x="1430" y="1072" class="id">UC19</text><text x="1430" y="1092" class="label">Kelola master wilayah, negara, dan UMP</text></g>
  <g><ellipse cx="590" cy="1215" rx="130" ry="36" class="uc"/><text x="590" y="1207" class="id">UC20</text><text x="590" y="1227" class="label">Melihat log aktivitas</text></g>
  <g><ellipse cx="940" cy="1215" rx="135" ry="36" class="uc"/><text x="940" y="1207" class="id">UC21</text><text x="940" y="1227" class="label">Analitik universitas</text></g>
  <g><ellipse cx="1240" cy="1215" rx="115" ry="36" class="uc"/><text x="1240" y="1207" class="id">UC22</text><text x="1240" y="1227" class="label">Analitik prodi</text></g>
  <g><ellipse cx="1530" cy="1215" rx="155" ry="36" class="uc"/><text x="1530" y="1207" class="id">UC26</text><text x="1530" y="1227" class="label">Analitik evaluasi pengguna lulusan</text></g>
  <g><ellipse cx="1040" cy="1350" rx="100" ry="32" class="uc"/><text x="1040" y="1343" class="id">UC25</text><text x="1040" y="1361" class="label">Logout</text></g>

