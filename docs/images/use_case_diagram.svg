  <path d="M1983 549L920 190M1983 549L855 535M1983 549L625 740M1983 549L935 740M1983 549L665 920M1983 549L1315 920M1983 549L835 1080M1983 549L805 1215M1983 549L1125 1215M1983 549L1375 1215M1983 549L1005 1350" class="assoc"/>
  <path d="M1983 794L920 190M1983 794L855 535M1983 794L625 740M1983 794L935 740M1983 794L805 1215M1983 794L1125 1215M1983 794L1375 1215M1983 794L1005 1350" class="assoc"/>
  <path d="M1983 1069L920 190M1983 1069L855 535M1983 1069L625 740M1983 1069L935 740M1983 1069L330 920M1983 1069L665 920M1983 1069L985 920M1983 1069L1315 920M1983 1069L515 1080M1983 1069L835 1080M1983 1069L1245 1080M1983 1069L460 1215M1983 1069L805 1215M1983 1069L1125 1215M1983 1069L1375 1215M1983 1069L1005 1350" class="assoc"/>
