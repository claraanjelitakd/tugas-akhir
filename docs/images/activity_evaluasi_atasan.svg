<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1480" width="1040" height="1480" style="background-color: #faf9f5; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrow Marker Sundaramoorthy Style -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6b1d2f"/>
    </marker>
    <filter id="soft-shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#3a1014" flood-opacity="0.10"/>
    </filter>
    <filter id="lane-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .doc-title { font-size: 19px; font-weight: 800; fill: #3e1218; letter-spacing: 0.3px; }
    .doc-sub { font-size: 12px; fill: #6b353b; }
    .lane-hdr { font-size: 15px; font-weight: 700; fill: #3a1014; text-anchor: middle; }
    .action-text { font-size: 12px; font-weight: 600; fill: #260c10; text-anchor: middle; }
    .action-sub { font-size: 10.5px; font-weight: 500; fill: #522227; text-anchor: middle; }
    .guard-text { font-size: 11px; font-weight: 600; fill: #6b1d2f; font-style: italic; }
    .flow-line { stroke: #6b1d2f; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-linejoin: round; stroke-linecap: round; }
    .flow-line-dashed { stroke: #6b1d2f; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Document Header Banner -->
  <rect x="25" y="15" width="990" height="70" rx="6" ry="6" fill="#fcf4e8" stroke="#d4a373" stroke-width="1.2" />
  <text x="45" y="44" class="doc-title">UML ACTIVITY DIAGRAM: TOKEN EVALUASI ATASAN LULUSAN</text>
  <text x="45" y="66" class="doc-sub">Format 2-Swimlane Mengacu Teori Sundaramoorthy (2022) - Passwordless Token Survey</text>

  <!-- Outer Frame -->
  <rect x="25" y="100" width="990" height="1360" rx="4" ry="4" fill="#ffffff" stroke="#6b1d2f" stroke-width="2.5" filter="url(#lane-shadow)" />

  <!-- Lane 1 Header -->
  <rect x="25" y="100" width="495" height="45" fill="#fdf0dd" stroke="#6b1d2f" stroke-width="2" />
  <text x="272" y="128" class="lane-hdr">Pengguna (Alumni UKDW / Atasan Kerja)</text>

  <!-- Lane 2 Header -->
  <rect x="520" y="100" width="495" height="45" fill="#fdf0dd" stroke="#6b1d2f" stroke-width="2" />
  <text x="767" y="128" class="lane-hdr">System (Sistem Tracer Study UKDW &amp; SMTP Engine)</text>

  <!-- Lane Vertical Divider -->
  <line x1="520" y1="100" x2="520" y2="1460" stroke="#6b1d2f" stroke-width="2" />

  <!-- Content Elements -->

    <!-- Initial Node -->
    <circle cx="272" cy="170" r="13" fill="#6b1d2f" stroke="#3a1014" stroke-width="1.5" />

<line x1="272" y1="183" x2="272" y2="215" class="flow-line" />

    <!-- Action State -->
    <rect x="157" y="216" width="230" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="272" y="233" class="action-text">Alumni Input Profil Pekerjaan</text>
<text x="272" y="250" class="action-sub">Isi Nama Kantor &amp; Email Atasan</text>

<line x1="272" y1="264" x2="272" y2="305" class="flow-line" />

    <!-- Action State -->
    <rect x="157" y="306" width="230" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="272" y="323" class="action-text">Klik Tombol &#x27;Simpan Profil&#x27;</text>
<text x="272" y="340" class="action-sub">Submit Form Karir ke Server</text>

<polyline points="387,330 767,330 767,385" class="flow-line" />
<text x="707" y="365" class="guard-text" text-anchor="right">[ Validasi Email Atasan ]</text>

    <!-- Decision Node -->
    <polygon points="767,387 790,405 767,423 744,405" fill="#fefee8" stroke="#6b1d2f" stroke-width="2" filter="url(#soft-shadow)" />

<line x1="790" y1="405" x2="962" y2="405" class="flow-line" />
<text x="872" y="395" class="guard-text" text-anchor="center">[email invalid/kosong]</text>

    <!-- Flow Final Node (Crossed Circle) -->
    <circle cx="977" cy="405" r="13" fill="#ffffff" stroke="#6b1d2f" stroke-width="2" />
    <line x1="970" y1="398" x2="984" y2="412" stroke="#6b1d2f" stroke-width="2" stroke-linecap="round"/>
    <line x1="984" y1="398" x2="970" y2="412" stroke="#6b1d2f" stroke-width="2" stroke-linecap="round"/>

<line x1="767" y1="423" x2="767" y2="475" class="flow-line" />
<text x="777" y="450" class="guard-text" text-anchor="left">[email valid]</text>

    <!-- Action State -->
    <rect x="652" y="476" width="230" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="767" y="493" class="action-text">Simpan Data Biodata Alumni</text>
<text x="767" y="510" class="action-sub">Update Record Karir &amp; Perusahaan</text>

<line x1="767" y1="524" x2="767" y2="565" class="flow-line" />

    <!-- Action State -->
    <rect x="647" y="566" width="240" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="767" y="583" class="action-text">Generate Token Kriptografis</text>
<text x="767" y="600" class="action-sub">Str::random(40) ke &#x27;evaluasi_atasans&#x27;</text>

<line x1="767" y1="614" x2="767" y2="655" class="flow-line" />

    <!-- Action State -->
    <rect x="647" y="656" width="240" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="767" y="673" class="action-text">Kirim Email Undangan via SMTP</text>
<text x="767" y="690" class="action-sub">Kirimkan URL Bertoken Unik ke Inbox</text>

<polyline points="647,680 272,680 272,735" class="flow-line" />

    <!-- Action State -->
    <rect x="157" y="736" width="230" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="272" y="753" class="action-text">Atasan Buka Email Undangan</text>
<text x="272" y="770" class="action-sub">Klik Tautan Evaluasi Bertoken</text>

<polyline points="387,760 767,760 767,815" class="flow-line" />
<text x="707" y="795" class="guard-text" text-anchor="right">[ Cek Integritas Token ]</text>

    <!-- Decision Node -->
    <polygon points="767,817 790,835 767,853 744,835" fill="#fefee8" stroke="#6b1d2f" stroke-width="2" filter="url(#soft-shadow)" />

<line x1="790" y1="835" x2="962" y2="835" class="flow-line" />
<text x="872" y="825" class="guard-text" text-anchor="center">[token invalid/not found]</text>

    <!-- Flow Final Node (Crossed Circle) -->
    <circle cx="977" cy="835" r="13" fill="#ffffff" stroke="#6b1d2f" stroke-width="2" />
    <line x1="970" y1="828" x2="984" y2="842" stroke="#6b1d2f" stroke-width="2" stroke-linecap="round"/>
    <line x1="984" y1="828" x2="970" y2="842" stroke="#6b1d2f" stroke-width="2" stroke-linecap="round"/>

<line x1="767" y1="853" x2="767" y2="905" class="flow-line" />
<text x="777" y="880" class="guard-text" text-anchor="left">[token valid]</text>

    <!-- Action State -->
    <rect x="647" y="905" width="240" height="50" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="767" y="923" class="action-text">Muat 12 Butir Instrumen Evaluasi</text>
<text x="767" y="940" class="action-sub">Render Form Evaluasi &amp; Data Alumni</text>

<polyline points="647,930 272,930 272,985" class="flow-line" />

    <!-- Action State -->
    <rect x="157" y="986" width="230" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="272" y="1003" class="action-text">Atasan Isi 12 Butir Penilaian</text>
<text x="272" y="1020" class="action-sub">Beri Skor Skala 1-5 &amp; Masukan Kinerja</text>

<line x1="272" y1="1034" x2="272" y2="1075" class="flow-line" />

    <!-- Action State -->
    <rect x="157" y="1076" width="230" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="272" y="1093" class="action-text">Klik &#x27;Kirim Evaluasi&#x27;</text>
<text x="272" y="1110" class="action-sub">Submit Respon Kuesioner</text>

<polyline points="387,1100 767,1100 767,1155" class="flow-line" />

    <!-- Action State -->
    <rect x="647" y="1156" width="240" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="767" y="1173" class="action-text">Update Database Respon</text>
<text x="767" y="1190" class="action-sub">Simpan ke &#x27;respons_evaluasi_atasan&#x27;</text>

<line x1="767" y1="1204" x2="767" y2="1245" class="flow-line" />

    <!-- Action State -->
    <rect x="647" y="1246" width="240" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="767" y="1263" class="action-text">Kunci Formulir Evaluasi</text>
<text x="767" y="1280" class="action-sub">Set is_submitted = true, submitted_at = now()</text>

<polyline points="647,1270 272,1270 272,1335" class="flow-line" />

    <!-- Action State -->
    <rect x="157" y="1336" width="230" height="48" rx="20" ry="20" fill="#fefee8" stroke="#6b1d2f" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="272" y="1353" class="action-text">Lihat Konfirmasi Selesai</text>
<text x="272" y="1370" class="action-sub">Tampilan Halaman Ucapan Terima Kasih</text>

<line x1="272" y1="1384" x2="272" y2="1420" class="flow-line" />

    <!-- Final Node (Bullseye) -->
    <circle cx="272" cy="1435" r="14" fill="#ffffff" stroke="#6b1d2f" stroke-width="2" />
    <circle cx="272" cy="1435" r="8.5" fill="#6b1d2f" />


</svg>
